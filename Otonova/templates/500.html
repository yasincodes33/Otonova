<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunucu Hatası — OtoNova</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:#f8fafc;color:#1e293b;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
    .num{font-size:6rem;font-weight:900;color:#2563eb;line-height:1}
    .ico{font-size:2.5rem;color:#94a3b8;margin:.5rem 0 1rem}
    h1{font-size:1.6rem;font-weight:800;margin-bottom:.75rem}
    p{color:#64748b;max-width:400px;margin:.5rem auto 2rem;line-height:1.6}
    a{display:inline-flex;align-items:center;gap:.5rem;background:#2563eb;color:#fff;padding:.75rem 1.5rem;border-radius:8px;text-decoration:none;font-weight:600;font-size:.9rem}
    a:hover{background:#1d4ed8}
  </style>
</head>
<body>
  <div>
    <div class="num">500</div>
    <i class="bi bi-exclamation-circle ico"></i>
    <h1>Bir Hata Oluştu</h1>
    <p>Sunucuda beklenmeyen bir hata meydana geldi. Lütfen daha sonra tekrar deneyin.</p>
    <a href="/"><i class="bi bi-house"></i> Ana Sayfaya Dön</a>
  </div>
</body>
</html>
