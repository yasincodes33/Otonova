services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-docker-secret-change-me}
      - ALLOWED_HOSTS=localhost,127.0.0.1
    restart: unless-stopped
